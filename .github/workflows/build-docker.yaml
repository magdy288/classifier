name: Build and Publish image to Docker
on:
    [workflow_dispatch]

jobs:
    publish_images:
        runs-on: ubuntu-latest
        
        steps:
          - name: checkout
            uses: actions/checkout@v4
          - name: build image
            run: docker build -t magdy288/crypto-classifier2:latest
          - name: push image to docker hub
            run: |
                docker login -u magdy288 -p ${{ secrets.DOCKER_HUB_TOKEN }}
                docker push magdy288/crypto-classifier2:latest
