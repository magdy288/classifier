name: Build and Publish image to Docker
on:
    [workflow-dispatch]

jobs:
    publish_images:
        run-on: ubuntu-latest
        steps:
            name: checkout
            uses: actions/checkout@v4
            name: build image
            run: docker build -t crypto-classifier2:latest
            name: push image to docker hub
            run: |
                docker push crypto-classifier2:latest
